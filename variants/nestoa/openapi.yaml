openapi: 3.1.0
info:
  title: Petstore API
  version: 1.0.0
paths:
  /v1/books:
    get:
      summary: Search the catalogue
      tags:
      - Books
      parameters:
      - name: searchBooksDto
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SearchBooksDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required:
                - resources
                - pagination
        '400':
          description: Invalid filter or sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a book to the catalogue
      tags:
      - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The book already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/books/export:
    get:
      summary: Export the whole catalogue as CSV
      tags:
      - Books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
  /v1/books/{isbn}:
    delete:
      summary: Remove a book from the catalogue
      tags:
      - Books
      parameters:
      - name: isbn
        in: path
        required: true
        description: ISBN-13, without dashes
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The book has not been found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get a book by ISBN
      tags:
      - Books
      parameters:
      - name: isbn
        in: path
        required: true
        description: ISBN-13, without dashes
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: The book has not been found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace a book
      tags:
      - Books
      parameters:
      - name: isbn
        in: path
        required: true
        description: ISBN-13, without dashes
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBookDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The book has not been found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
