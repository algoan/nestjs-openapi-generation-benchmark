components:
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        complement:
          type: string
          description: Building, floor, etc.
      required:
      - street
      - city
      - postalCode
    Adopter:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Phone number, in the E.164 format
      required:
      - firstName
      - lastName
      - email
    Adoption:
      type: object
      properties:
        _id:
          type: string
        shelterId:
          type: string
        animalId:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        adopter:
          $ref: '#/components/schemas/Adopter'
        status:
          $ref: '#/components/schemas/AdoptionRequestStatus'
        fee:
          type: number
          description: Adoption fee, in euros
        notes:
          type: string
        rejectionReason:
          type: string
          description: Why the request was rejected
        decidedAt:
          type: string
          format: date-time
          description: When the request was approved or rejected
        createdAt:
          type: string
          format: date-time
          description: Value added by mongoose
        updatedAt:
          type: string
          format: date-time
          description: Value added by mongoose
      required:
      - _id
      - shelterId
      - animalId
      - species
      - adopter
      - status
      - fee
      - createdAt
      - updatedAt
    AdoptionReceipt:
      type: object
      properties:
        adoptionId:
          type: string
        status:
          $ref: '#/components/schemas/AdoptionRequestStatus'
        expectedDecisionDate:
          type: string
          format: date-time
          description: When the shelter commits to answer
      required:
      - adoptionId
      - status
      - expectedDecisionDate
    AdoptionRequestStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    AdoptionStatus:
      type: string
      enum:
      - AVAILABLE
      - RESERVED
      - ADOPTED
    Animal:
      type: object
      properties:
        _id:
          type: string
        shelterId:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          $ref: '#/components/schemas/Sex'
        status:
          $ref: '#/components/schemas/AdoptionStatus'
        vaccinations:
          type: array
          items:
            $ref: '#/components/schemas/Vaccination'
        weightKg:
          type: number
          description: Weight in kilograms
        createdAt:
          type: string
          format: date-time
          description: Value added by mongoose
        updatedAt:
          type: string
          format: date-time
          description: Value added by mongoose
      required:
      - _id
      - shelterId
      - species
      - name
      - sex
      - status
      - vaccinations
      - createdAt
      - updatedAt
    Author:
      type: object
      properties:
        name:
          type: string
        birthYear:
          type: number
      required:
      - name
    Book:
      type: object
      properties:
        _id:
          type: string
        isbn:
          type: string
          description: ISBN-13, without dashes
        title:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        genre:
          $ref: '#/components/schemas/BookGenre'
        publishedOn:
          type: string
          format: date-time
        pageCount:
          type: number
        language:
          type: string
          description: ISO 639-1 language code
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Species'
          description: Species the book is about
        rating:
          type: number
          description: Average reader rating, from 0 to 5
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: Value added by mongoose
        updatedAt:
          type: string
          format: date-time
          description: Value added by mongoose
      required:
      - _id
      - isbn
      - title
      - authors
      - genre
      - language
      - topics
      - available
      - createdAt
      - updatedAt
    BookGenre:
      type: string
      enum:
      - CARE_GUIDE
      - TRAINING
      - NOVEL
      - CHILDREN
    Cat:
      allOf:
      - $ref: '#/components/schemas/Animal'
      - type: object
        properties:
          species:
            type: string
            enum:
            - CAT
          indoor:
            type: boolean
            description: Whether the cat must live indoors
          coatPattern:
            $ref: '#/components/schemas/CoatPattern'
        required:
        - species
        - indoor
    CoatPattern:
      type: string
      enum:
      - SOLID
      - TABBY
      - TORTOISESHELL
      - CALICO
      - BICOLOR
    CreateAdoptionDto:
      type: object
      properties:
        animalId:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        adopter:
          $ref: '#/components/schemas/Adopter'
        fee:
          type: number
          description: Adoption fee, in euros
        notes:
          type: string
      required:
      - animalId
      - species
      - adopter
      - fee
    CreateAnimalDto:
      type: object
      properties:
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          $ref: '#/components/schemas/Sex'
        vaccinations:
          type: array
          items:
            $ref: '#/components/schemas/Vaccination'
        weightKg:
          type: number
          description: Weight in kilograms
      required:
      - name
      - sex
    CreateBookDto:
      type: object
      properties:
        isbn:
          type: string
          description: ISBN-13, without dashes
        title:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        genre:
          $ref: '#/components/schemas/BookGenre'
        publishedOn:
          type: string
          format: date-time
        pageCount:
          type: number
        language:
          type: string
          description: ISO 639-1 language code
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Species'
          description: Species the book is about
        rating:
          type: number
          description: Average reader rating, from 0 to 5
        available:
          type: boolean
      required:
      - isbn
      - title
      - authors
      - genre
    CreateCatDto:
      allOf:
      - $ref: '#/components/schemas/CreateAnimalDto'
      - type: object
        properties:
          indoor:
            type: boolean
            description: Whether the cat must live indoors
          coatPattern:
            $ref: '#/components/schemas/CoatPattern'
        required:
        - indoor
    CreateDogDto:
      allOf:
      - $ref: '#/components/schemas/CreateAnimalDto'
      - type: object
        properties:
          breed:
            type: string
          size:
            $ref: '#/components/schemas/DogSize'
          goodWithKids:
            type: boolean
        required:
        - breed
        - size
    CreateShelterDto:
      type: object
      properties:
        name:
          type: string
          description: Display name of the shelter
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          description: Contact email
        capacity:
          type: number
          description: Maximum number of animals the shelter can host
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form data attached by the caller
      required:
      - name
      - country
      - capacity
    Dog:
      allOf:
      - $ref: '#/components/schemas/Animal'
      - type: object
        properties:
          species:
            type: string
            enum:
            - DOG
          breed:
            type: string
          size:
            $ref: '#/components/schemas/DogSize'
          goodWithKids:
            type: boolean
        required:
        - species
        - breed
        - size
    DogSize:
      type: string
      enum:
      - SMALL
      - MEDIUM
      - LARGE
    Error:
      type: object
      description: Error response emitted by the global HttpExceptionFilter.
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
      required:
      - code
      - message
      - status
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        uptime:
          type: number
          description: Process uptime, in seconds
      required:
      - status
      - uptime
    PaginationLinks:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        first:
          type:
          - string
          - 'null'
        last:
          type:
          - string
          - 'null'
        totalPages:
          type:
          - number
          - 'null'
        totalResources:
          type:
          - number
          - 'null'
      required:
      - next
      - previous
      - first
      - last
      - totalPages
      - totalResources
    RejectAdoptionDto:
      type: object
      properties:
        reason:
          type: string
          description: Why the request is rejected, sent to the adopter
      required:
      - reason
    ReplaceBookDto:
      type: object
      properties: {}
    SearchAnimalsDto:
      type: object
      properties:
        species:
          $ref: '#/components/schemas/Species'
        status:
          $ref: '#/components/schemas/AdoptionStatus'
        name:
          type: string
          description: Case-insensitive prefix of the animal name
        minAge:
          type: number
          description: Minimum age, in years
    SearchBooksDto:
      type: object
      properties:
        search:
          type: string
          description: Full-text search on the title and the authors
        genre:
          $ref: '#/components/schemas/BookGenre'
    Sex:
      type: string
      enum:
      - FEMALE
      - MALE
      - UNKNOWN
    Shelter:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          description: Display name of the shelter
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          description: Contact email
        capacity:
          type: number
          description: Maximum number of animals the shelter can host
        status:
          $ref: '#/components/schemas/ShelterStatus'
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form data attached by the caller
        createdAt:
          type: string
          format: date-time
          description: Value added by mongoose
        updatedAt:
          type: string
          format: date-time
          description: Value added by mongoose
      required:
      - _id
      - name
      - country
      - capacity
      - status
      - tags
      - createdAt
      - updatedAt
    ShelterStats:
      type: object
      properties:
        shelterId:
          type: string
        year:
          type: number
        hostedAnimals:
          type: number
          description: Number of animals currently hosted
        adoptions:
          type: object
          properties:
            approved:
              type: number
            rejected:
              type: number
            pending:
              type: number
          required:
          - approved
          - rejected
          - pending
        occupancyRate:
          type: number
          description: Hosted animals / capacity, between 0 and 1
      required:
      - shelterId
      - year
      - hostedAnimals
      - adoptions
      - occupancyRate
    ShelterStatus:
      type: string
      enum:
      - OPEN
      - FULL
      - CLOSED
    Species:
      type: string
      enum:
      - CAT
      - DOG
    UpdateCatDto:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AdoptionStatus'
    UpdateShelterDto:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ShelterStatus'
    Vaccination:
      type: object
      properties:
        name:
          type: string
          description: Vaccine name
        date:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
      - name
      - date
