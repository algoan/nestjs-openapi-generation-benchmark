        in: path
        required: true
        schema:
          type: string
      - name: searchAnimalsDto
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SearchAnimalsDto'
      - name: includeAdopted
        in: query
        required: true
        description: Include the animals already adopted
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/Cat'
