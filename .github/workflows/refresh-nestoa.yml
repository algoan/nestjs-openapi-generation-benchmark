name: Refresh nestoa results

# Re-runs a nestoa variant when nestoa changes and opens a pull request with the new results:
#   - nestoa-main:    a commit was merged on algoan/nestoa main (dispatched by its CI workflow);
#   - nestoa-release: a version was published (dispatched by its release workflow).
#
# Speed and memory are not measured here: a CI runner is not the machine the other tools were measured
# on, so the report keeps the numbers of the last local `npm run bench`.
#
# Needs the NESTOA_TOKEN secret (read access to the contents of algoan/nestoa) to build nestoa main, and
# read access of this repository to the @algoan/nestoa package (package settings → Manage Actions access).
on:
  repository_dispatch:
    types: [nestoa-main, nestoa-release]
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to refresh
        type: choice
        options: [nestoa-main, nestoa]
        required: true
      ref:
        description: "nestoa-main: commit, tag or branch of algoan/nestoa to build"
        default: main
      version:
        description: "nestoa: version of @algoan/nestoa to install"
        default: latest

# One group per variant, whatever the trigger: both update the same bot/refresh-<variant> branch
concurrency:
  group: refresh-${{ github.event_name == 'workflow_dispatch' && inputs.variant || (github.event.action == 'nestoa-release' && 'nestoa' || 'nestoa-main') }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh ${{ github.event.action || inputs.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    env:
      OASDIFF_VERSION: 1.34.0 # the version of the published results
      VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || (github.event.action == 'nestoa-release' && 'nestoa' || 'nestoa-main') }}
      NESTOA_REF: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
      NESTOA_VERSION: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the harness and the app
        run: |
          npm --prefix bench ci --no-audit --no-fund
          npm --prefix app ci --no-audit --no-fund

      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v$OASDIFF_VERSION/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Keep the current document
        run: cp "bench/results/$VARIANT/openapi.yaml" "$RUNNER_TEMP/before.yaml"

      - name: Install Rust
        if: env.VARIANT == 'nestoa-main'
        uses: dtolnay/rust-toolchain@stable

      - name: Build nestoa main
        if: env.VARIANT == 'nestoa-main'
        env:
          NESTOA_REPO: https://x-access-token:${{ secrets.NESTOA_TOKEN }}@github.com/algoan/nestoa.git
        run: |
          bench/scripts/build-nestoa-main.sh
          SHORT=$(cut -c1-7 .tools/bin/nestoa-main.commit)
          echo "NESTOA_LABEL=main@$SHORT" >> "$GITHUB_ENV"
          # Pin the build script and the reported version to the benchmarked commit
          sed -i "s/NESTOA_REF:-[0-9a-f]*}/NESTOA_REF:-$SHORT}/" bench/scripts/build-nestoa-main.sh
          node -e '
            const fs = require("node:fs");
            const file = "variants/nestoa-main/bench.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          ' "main@$SHORT"
          node bench/src/cli.ts install --only nestoa-main

      - name: Install the released nestoa
        if: env.VARIANT == 'nestoa'
        working-directory: variants/nestoa
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          npm install --no-audit --no-fund --save-exact "@algoan/nestoa@$NESTOA_VERSION"
          echo "NESTOA_LABEL=$(node -p 'require("@algoan/nestoa/package.json").version')" >> "$GITHUB_ENV"

      - name: Run the benchmark (ease and correctness)
        run: |
          node bench/src/cli.ts run --only "$VARIANT" --skip-perf
          # `run` records a failed variant instead of exiting: never open a pull request for it
          node -e '
            const { variants } = require("./bench/results/results.json");
            const result = variants.find((v) => v.name === process.argv[1]);
            const error = result === undefined ? "no result" : result.error ?? (result.oasdiff?.available ? undefined : result.oasdiff?.error);
            if (error !== undefined) {
              console.error(`::error::${process.argv[1]}: ${error}`);
              process.exit(1);
            }
          ' "$VARIANT"

      - name: Compare with the previous document
        # A regression is reported in the pull request, not a failure: the results must still be recorded
        run: |
          node bench/src/cli.ts check "bench/results/$VARIANT/openapi.yaml" --baseline "$RUNNER_TEMP/before.yaml" \
            --summary "$RUNNER_TEMP/check.md" || echo "::warning::$VARIANT has more differences than before"
          cat "$RUNNER_TEMP/check.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Results of \`$VARIANT\` refreshed for nestoa \`$NESTOA_LABEL\` by the [refresh workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Speed and memory are the ones of the last local run. Before merging, update by hand:"
            echo
            echo "- the notes of \`variants/$VARIANT/bench.json\` and the \"Results at a glance\" table of the README;"
            echo "- for a release, the annotations of \`variants/nestoa\` that the new version no longer needs (see \`variants/nestoa-main\`)."
            echo
            cat "$RUNNER_TEMP/check.md"
          } > "$RUNNER_TEMP/body.md"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/refresh-${{ env.VARIANT }}
          commit-message: "chore: refresh ${{ env.VARIANT }} results (${{ env.NESTOA_LABEL }})"
          title: "[CHORE] Refresh ${{ env.VARIANT }} results (${{ env.NESTOA_LABEL }})"
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true
