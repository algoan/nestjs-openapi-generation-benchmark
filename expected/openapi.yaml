# Reference OpenAPI document of the petstore app (`app/`), written by hand.
#
# It describes what the server really does on the wire:
#   - every route is served under the `v1` global prefix,
#   - paginated routes return the envelope built by PaginationBodyInterceptor,
#   - errors are formatted by HttpExceptionFilter as `{ code, message, status }`,
#   - `@internal` fields are stripped from the responses (Shelter.isDeleted),
#   - Mongo ObjectIds and Dates are serialized as strings.
#
# Validation constraints are only listed when a class-validator decorator has a
# direct JSON-schema equivalent (IsInt, Min, Max, MinLength, MaxLength, Length,
# ArrayMinSize, ArrayMaxSize, IsEmail). Descriptions only come from JSDoc
# comments present in the code. `test/contract.e2e-spec.ts` checks the real
# responses against this document.
openapi: 3.1.0
info:
  title: Petstore API
  version: 1.0.0
paths:
  /v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /v1/shelters:
    post:
      summary: Create a shelter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShelterDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelter'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List the shelters the caller has access to
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shelter'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required: [resources, pagination]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/shelters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The shelter id
        schema:
          type: string
    get:
      summary: Get a shelter by id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelter'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a shelter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShelterDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelter'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a shelter
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{id}/stats:
    get:
      summary: Get the yearly statistics of a shelter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The shelter id
          schema:
            type: string
        - name: year
          in: query
          required: true
          description: The year of the statistics
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelterStats'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/cats:
    parameters:
      - $ref: '#/components/parameters/shelterId'
    post:
      summary: Register a cat in a shelter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List the cats of a shelter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cat'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required: [resources, pagination]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/cats/{catId}:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - name: catId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a cat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a cat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a cat from a shelter
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/dogs:
    parameters:
      - $ref: '#/components/parameters/shelterId'
    post:
      summary: Register a dog in a shelter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDogDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List the dogs of a shelter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dog'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required: [resources, pagination]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/dogs/{dogId}:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - name: dogId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a dog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/animals:
    parameters:
      - $ref: '#/components/parameters/shelterId'
    get:
      summary: Search the animals of a shelter
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Species'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdoptionStatus'
        - name: name
          in: query
          required: false
          description: Case-insensitive prefix of the animal name
          schema:
            type: string
            maxLength: 50
        - name: minAge
          in: query
          required: false
          description: Minimum age, in years
          schema:
            type: integer
            minimum: 0
        - name: includeAdopted
          in: query
          required: false
          description: Include the animals already adopted
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/Cat'
                    - $ref: '#/components/schemas/Dog'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/animals/{animalId}:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - name: animalId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get an animal, whatever its species
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Cat'
                  - $ref: '#/components/schemas/Dog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/adoptions:
    parameters:
      - $ref: '#/components/parameters/shelterId'
    post:
      summary: File an adoption request
      security:
        - bearerAuth: []
      parameters:
        - name: x-request-id
          in: header
          required: false
          description: Correlation id, echoed in the logs
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdoptionDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List the adoption requests of a shelter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - name: status
          in: query
          required: false
          description: Only return the requests in this status
          schema:
            $ref: '#/components/schemas/AdoptionRequestStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adoption'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required: [resources, pagination]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/adoptions/{adoptionId}:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - $ref: '#/components/parameters/adoptionId'
    get:
      summary: Get an adoption request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Cancel an adoption request
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shelters/{shelterId}/adoptions/{adoptionId}/approve:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - $ref: '#/components/parameters/adoptionId'
    post:
      summary: Approve a pending adoption request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/shelters/{shelterId}/adoptions/{adoptionId}/reject:
    parameters:
      - $ref: '#/components/parameters/shelterId'
      - $ref: '#/components/parameters/adoptionId'
    post:
      summary: Reject a pending adoption request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAdoptionDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adoption'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/books:
    get:
      summary: Search the catalogue
      security: []
      parameters:
        - name: search
          in: query
          required: false
          description: Full-text search on the title and the authors
          schema:
            type: string
        - name: genre
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookGenre'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  pagination:
                    $ref: '#/components/schemas/PaginationLinks'
                required: [resources, pagination]
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Add a book to the catalogue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/books/export:
    get:
      summary: Export the whole catalogue as CSV
      security: []
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string

  /v1/books/{isbn}:
    parameters:
      - name: isbn
        in: path
        required: true
        description: ISBN-13, without dashes
        schema:
          type: string
    get:
      summary: Get a book by ISBN
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Replace a book
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBookDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a book from the catalogue
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    shelterId:
      name: shelterId
      in: path
      required: true
      schema:
        type: string
    adoptionId:
      name: adoptionId
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'

  schemas:
    HttpError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: number
      required: [code, message, status]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          description: Process uptime, in seconds
      required: [status, uptime]

    PaginationLinks:
      type: object
      properties:
        next:
          type: [string, 'null']
        previous:
          type: [string, 'null']
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        totalPages:
          type: [number, 'null']
        totalResources:
          type: [number, 'null']
      required: [next, previous, first, last, totalPages, totalResources]

    # ---------------------------------------------------------------- shelters
    ShelterStatus:
      type: string
      enum: [OPEN, FULL, CLOSED]

    Address:
      type: object
      properties:
        street:
          type: string
          maxLength: 120
        city:
          type: string
        postalCode:
          type: string
        complement:
          type: string
          description: Building, floor, etc.
      required: [street, city, postalCode]

    Shelter:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          description: Display name of the shelter
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          description: Contact email
        capacity:
          type: number
          description: Maximum number of animals the shelter can host
        status:
          $ref: '#/components/schemas/ShelterStatus'
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form data attached by the caller
        createdAt:
          type: string
          format: date-time
          description: Value added by mongoose
        updatedAt:
          type: string
          format: date-time
          description: Value added by mongoose
      required: [_id, name, country, capacity, status, tags, createdAt, updatedAt]

    CreateShelterDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name of the shelter
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
          description: Contact email
        capacity:
          type: integer
          minimum: 0
          maximum: 1000
          description: Maximum number of animals the shelter can host
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form data attached by the caller
      required: [name, country, capacity]

    UpdateShelterDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name of the shelter
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
          description: Contact email
        capacity:
          type: integer
          minimum: 0
          maximum: 1000
          description: Maximum number of animals the shelter can host
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form data attached by the caller
        status:
          $ref: '#/components/schemas/ShelterStatus'

    ShelterStats:
      type: object
      properties:
        shelterId:
          type: string
        year:
          type: number
        hostedAnimals:
          type: number
          description: Number of animals currently hosted
        adoptions:
          type: object
          properties:
            approved:
              type: number
            rejected:
              type: number
            pending:
              type: number
          required: [approved, rejected, pending]
        occupancyRate:
          type: number
          description: Hosted animals / capacity, between 0 and 1
      required: [shelterId, year, hostedAnimals, adoptions, occupancyRate]

